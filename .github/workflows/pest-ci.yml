# Reusable Pest CI — runs on believe-vps with ephemeral SQLite only.
# Never uses production/staging MySQL. GitHub-hosted ubuntu is avoided (private-repo minutes / queue).
name: Pest CI (reusable)

on:
  workflow_call:

jobs:
  pest:
    name: Pest CI suite (PHP 8.4 / SQLite on believe-vps)
    runs-on: [self-hosted, believe-vps]
    timeout-minutes: 20

    env:
      # Self-hosted runner forces Node 24; allow checkout action Node until runner image catches up.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      BROADCAST_CONNECTION: log

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Ensure Composer
        run: |
          set -euo pipefail
          php -v | head -1
          php -m | grep -qi pdo_sqlite || { echo "::error::pdo_sqlite required for CI SQLite"; exit 1; }
          mkdir -p "${HOME}/bin"
          if ! command -v composer >/dev/null 2>&1; then
            curl -fsSL https://getcomposer.org/installer | php -- --install-dir="${HOME}/bin" --filename=composer
          fi
          echo "${HOME}/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/bin:${PATH}"
          composer --version

      - name: Install dependencies
        run: |
          set -euo pipefail
          export PATH="${HOME}/bin:${PATH}"
          composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader --ignore-platform-req=ext-sodium

      - name: Prepare application
        run: |
          set -euo pipefail
          cp .env.example .env
          mkdir -p storage/framework/{cache,sessions,views} storage/logs bootstrap/cache
          chmod -R ug+rwx storage bootstrap/cache
          php artisan key:generate --force
          php artisan config:clear

      - name: Run Pest CI suite
        run: php artisan test --compact --testsuite=CI
