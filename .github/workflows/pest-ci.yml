# Reusable Pest CI suite — GitHub-hosted ubuntu + ephemeral SQLite only (never VPS MySQL).
# Kept on ubuntu-latest so Tests are not blocked when the self-hosted runner cannot acquire jobs.
name: Pest CI (reusable)

on:
  workflow_call:

jobs:
  pest:
    name: Pest CI suite (PHP 8.4 / SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/ci-testing.sqlite
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      BROADCAST_CONNECTION: log

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, cURL, bcmath, intl, gd, zip, pdo_sqlite, sqlite3, redis, pcntl, posix, sodium
          coverage: none
          tools: composer:v2

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php8.4-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.4-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Prepare application (ephemeral SQLite)
        run: |
          set -euo pipefail
          cp .env.example .env
          mkdir -p storage/framework/{cache,sessions,views} storage/logs bootstrap/cache database
          : > database/ci-testing.sqlite
          chmod -R ug+rwx storage bootstrap/cache database
          php artisan key:generate --force
          php artisan config:clear

      - name: Run Pest CI suite
        run: php artisan test --compact --testsuite=CI
