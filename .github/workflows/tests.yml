# Pest / PHPUnit — Production Roadmap: Automated Testing via GitHub Actions
#
# IMPORTANT: This job uses ONLY the GitHub Actions MySQL service container
# (believe_testing). It never connects to production/staging VPS databases
# and never runs migrate:fresh against live data.
name: Tests

on:
  push:
    branches: [main, development, production]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: Pest CI suite (PHP ${{ matrix.php }} / GHA MySQL only)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: true
      matrix:
        php: ['8.4']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: believe_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: believe_testing
      DB_USERNAME: root
      DB_PASSWORD: password
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      BROADCAST_CONNECTION: log

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, cURL, bcmath, intl, gd, zip, pdo_mysql, mysql, redis, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Prepare application
        run: |
          cp .env.example .env
          mkdir -p storage/framework/{cache,sessions,views} storage/logs bootstrap/cache
          chmod -R ug+rwx storage bootstrap/cache
          php artisan key:generate --force
          php artisan config:clear

      # Stable CI gate only (no migrate:fresh / RefreshDatabase). Full Unit+Feature suite remains available locally.
      - name: Run Pest CI suite
        run: php artisan test --compact --testsuite=CI
