# Pest for PRs / manual runs only — NOT on every branch push.
# Deploy workflows also call pest-ci.yml in parallel (non-blocking); PR checks stay here.
name: Tests

on:
  pull_request:
    branches: [main, development, production]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    uses: ./.github/workflows/pest-ci.yml
